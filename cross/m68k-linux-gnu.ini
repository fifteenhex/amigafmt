# Cross file for building on another host with Debian's m68k-linux-gnu
# toolchain:  meson setup --cross-file cross/m68k-linux-gnu.ini build
# The exe wrapper lets configure-time checks and `meson test` run the
# m68k binaries under qemu-m68k.
[binaries]
c = 'm68k-linux-gnu-gcc'
ar = 'm68k-linux-gnu-ar'
strip = 'm68k-linux-gnu-strip'
exe_wrapper = ['qemu-m68k']

[built-in options]
# the sanity check binary too has to run under qemu-m68k without a sysroot
c_link_args = ['-static']

[host_machine]
system = 'linux'
cpu_family = 'm68k'
cpu = 'm68040'
endian = 'big'
